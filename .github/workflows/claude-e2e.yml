# Throwaway harness: install the real Claude Desktop on a Windows runner and
# dualize it. Not part of the upstream PR — this branch exists to answer
# "does this actually work on a Windows machine with a real app?".
name: Claude E2E (Windows)

on:
  push:
    branches: [ci/claude-windows-e2e]

jobs:
  claude:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund

      - name: Download Claude Desktop (official Anthropic build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://storage.googleapis.com/osprey-downloads-c02f6a0d-347c-492b-a752-3e0651722e97/nest-win-x64/Claude-Setup-x64.exe'
          $out = "$env:RUNNER_TEMP\Claude-Setup-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          $f = Get-Item $out
          Write-Host "downloaded : $($f.Length) bytes"
          Write-Host "sha256     : $((Get-FileHash $out -Algorithm SHA256).Hash)"
          "SETUP=$out" | Out-File -Append $env:GITHUB_ENV

      - name: Install it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # Squirrel installers exit immediately and keep working in the background,
          # then auto-launch the app. Give it room, then stop whatever it started.
          Start-Process -FilePath $env:SETUP -PassThru | Out-Null
          Start-Sleep -Seconds 90
          Get-Process claude -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 5
          Write-Host '--- %LOCALAPPDATA%\AnthropicClaude ---'
          Get-ChildItem "$env:LOCALAPPDATA\AnthropicClaude" -ErrorAction SilentlyContinue |
            Select-Object Mode, Length, Name | Format-Table | Out-String -Width 120

      - name: Locate the Electron app directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asar = Get-ChildItem "$env:LOCALAPPDATA\AnthropicClaude" -Recurse -Filter app.asar `
                    -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $asar) { Write-Error 'no app.asar found — Claude did not install'; exit 1 }
          $appDir = Split-Path (Split-Path $asar.FullName -Parent) -Parent
          Write-Host "app dir  : $appDir"
          Write-Host "app.asar : $([math]::Round($asar.Length/1MB,1)) MB"
          Get-ChildItem $appDir -Filter *.exe | Select-Object Name, Length |
            Format-Table | Out-String -Width 120
          "APPDIR=$appDir" | Out-File -Append $env:GITHUB_ENV

      - name: What does the tool see?
        shell: pwsh
        run: |
          node -e "require('./src/win/appinfo').inspectApp(process.argv[1]).then(i=>console.log(JSON.stringify(i,null,2)))" "$env:APPDIR"

      - name: Baseline — data dirs before cloning
        shell: pwsh
        run: |
          Get-ChildItem "$env:APPDATA" -Directory |
            Where-Object { $_.Name -like 'Claude*' } |
            Select-Object Name, CreationTime | Format-Table | Out-String -Width 120

      - name: Dualize it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & .\clone-app.ps1 -Source "$env:APPDIR" -Name "Claude 2" -DestDir "$env:RUNNER_TEMP\Programs" -Desktop
          Write-Host "clone-app.ps1 exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Inspect what was produced
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $dest = "$env:RUNNER_TEMP\Programs\Claude 2"
          Get-ChildItem $dest -ErrorAction SilentlyContinue |
            Select-Object Mode, Length, Name | Format-Table | Out-String -Width 120

          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Claude 2.lnk"
          if (Test-Path $lnk) {
            $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
            Write-Host "shortcut target : $($sc.TargetPath)"
            Write-Host "shortcut args   : $($sc.Arguments)"
            Write-Host "shortcut icon   : $($sc.IconLocation)"
          } else { Write-Host '::warning::no Start Menu shortcut' }

          # Did the isolation snippet make it into the repacked archive, or was
          # injection skipped because the exe enforces asar integrity?
          $clonedAsar = Join-Path $dest 'resources\app.asar'
          if (Test-Path $clonedAsar) {
            $ex = "$env:RUNNER_TEMP\cloned-extract"
            npx --yes @electron/asar extract $clonedAsar $ex 2>$null
            $hits = Get-ChildItem $ex -Recurse -File -Include *.js -ErrorAction SilentlyContinue |
                    Select-String -Pattern 'mac-app-dualizer: isolated userData' -List
            if ($hits) { $hits | ForEach-Object { Write-Host "snippet found in: $($_.Path)" } }
            else { Write-Host 'snippet NOT in the archive (expected if integrity is enforced)' }
          }

      - name: Launch the ORIGINAL, then the CLONE
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $origExe = Get-ChildItem "$env:APPDIR" -Filter *.exe | Select-Object -First 1

          Write-Host "--- launching original: $($origExe.FullName)"
          Start-Process -FilePath $origExe.FullName | Out-Null
          Start-Sleep -Seconds 60
          Get-Process | Where-Object { $_.ProcessName -like 'claude*' } |
            Select-Object Id, ProcessName, MainWindowTitle | Format-Table | Out-String -Width 120
          Get-Process | Where-Object { $_.ProcessName -like 'claude*' } | Stop-Process -Force
          Start-Sleep -Seconds 10

          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Claude 2.lnk"
          Write-Host "--- launching clone via its shortcut: $lnk"
          if (Test-Path $lnk) { Start-Process -FilePath $lnk | Out-Null }
          Start-Sleep -Seconds 60
          Get-Process | Where-Object { $_.ProcessName -like '*laude*' } |
            Select-Object Id, ProcessName, MainWindowTitle | Format-Table | Out-String -Width 120

      - name: Screenshot the desktop
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\desktop.png")
          Write-Host "screenshot: $((Get-Item "$env:RUNNER_TEMP\desktop.png").Length) bytes"

      - name: THE ACTUAL QUESTION — two separate data directories?
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Get-Process | Where-Object { $_.ProcessName -like '*laude*' } | Stop-Process -Force
          Start-Sleep -Seconds 5

          $dirs = Get-ChildItem "$env:APPDATA" -Directory | Where-Object { $_.Name -like 'Claude*' }
          $dirs | Select-Object Name, CreationTime | Format-Table | Out-String -Width 120
          foreach ($d in $dirs) {
            $n = (Get-ChildItem $d.FullName -Recurse -File -ErrorAction SilentlyContinue).Count
            Write-Host "$($d.Name): $n files"
          }

          $a = Test-Path "$env:APPDATA\Claude"
          $b = Test-Path "$env:APPDATA\Claude 2"
          Write-Host ""
          Write-Host "original data dir (%APPDATA%\Claude)   : $a"
          Write-Host "clone    data dir (%APPDATA%\Claude 2) : $b"
          if ($a -and $b) { Write-Host '::notice::ISOLATION CONFIRMED — two independent data directories' }
          else { Write-Host '::warning::isolation NOT confirmed' }

      - name: dualize list / remove round-trip
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          node bin/dualize.js list
          node bin/dualize.js remove "Claude 2" --purge
          Write-Host "shortcut gone: $(-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Claude 2.lnk"))"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-e2e-evidence
          path: |
            ${{ runner.temp }}/desktop.png
            ${{ runner.temp }}/Programs/Claude 2/*.ico
          if-no-files-found: warn
