name: Claude E2E (Windows)

on:
  push:
    branches: [ci/claude-windows-e2e]

jobs:
  claude:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund

      - name: Install Claude Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://storage.googleapis.com/osprey-downloads-c02f6a0d-347c-492b-a752-3e0651722e97/nest-win-x64/Claude-Setup-x64.exe'
          $out = "$env:RUNNER_TEMP\Claude-Setup-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          Start-Process -FilePath $out -PassThru | Out-Null
          Start-Sleep -Seconds 90
          Get-Process claude -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 5
          $asar = Get-ChildItem "$env:LOCALAPPDATA\AnthropicClaude" -Recurse -Filter app.asar | Select-Object -First 1
          $appDir = Split-Path (Split-Path $asar.FullName -Parent) -Parent
          Write-Host "app dir: $appDir"
          "APPDIR=$appDir" | Out-File -Append $env:GITHUB_ENV

      # CONTROL: the untouched app must launch, or nothing below means anything.
      - name: CONTROL — does the ORIGINAL launch?
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Start-Process -FilePath "$env:APPDIR\claude.exe" | Out-Null
          Start-Sleep -Seconds 50
          $p = @(Get-Process claude -ErrorAction SilentlyContinue)
          Write-Host "original processes: $($p.Count)"
          $n = (Get-ChildItem "$env:APPDATA\Claude" -Recurse -File -EA SilentlyContinue).Count
          Write-Host "%APPDATA%\Claude file count: $n"
          if ($p.Count -eq 0) { Write-Host '::error::the ORIGINAL did not launch — runner cannot host this app' }
          $p | Stop-Process -Force
          Start-Sleep -Seconds 10

      - name: Clone A (default — inject into app.asar)
        shell: pwsh
        run: |
          & .\clone-app.ps1 -Source "$env:APPDIR" -Name "Claude A" -DestDir "$env:RUNNER_TEMP\P"
          Write-Host "exit: $LASTEXITCODE"

      - name: Clone B (--no-isolate — copy only, no injection)
        shell: pwsh
        run: |
          & .\clone-app.ps1 -Source "$env:APPDIR" -Name "Claude B" -DestDir "$env:RUNNER_TEMP\P" --no-isolate
          Write-Host "exit: $LASTEXITCODE"

      # Settles the contradiction between "app.asar repacked" and my earlier grep.
      - name: Is the snippet REALLY in Clone A's archive?
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ex = "$env:RUNNER_TEMP\exA"
          npx --yes @electron/asar extract "$env:RUNNER_TEMP\P\Claude A\resources\app.asar" $ex
          $hits = Get-ChildItem $ex -Recurse -File | Select-String -Pattern 'isolated userData' -List
          Write-Host "files in archive : $((Get-ChildItem $ex -Recurse -File).Count)"
          Write-Host "snippet hits     : $($hits.Count)"
          $hits | ForEach-Object { Write-Host "  $($_.Path)" }
          $pkg = Get-Content "$ex\package.json" -Raw -EA SilentlyContinue
          if ($pkg) { Write-Host "package.json main: $(($pkg | ConvertFrom-Json).main)" }

      - name: Does Clone A (injected) launch?
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $t0 = Get-Date
          Start-Process -FilePath "$env:RUNNER_TEMP\P\Claude A\Claude A.exe" -ArgumentList '--user-data-dir="C:\ud-a"' | Out-Null
          Start-Sleep -Seconds 50
          $p = @(Get-CimInstance Win32_Process -Filter "Name = 'Claude A.exe'")
          Write-Host "Clone A processes: $($p.Count)"
          $p | Select-Object -First 2 -ExpandProperty CommandLine | ForEach-Object { Write-Host "  $_" }
          Write-Host "C:\ud-a files            : $((Get-ChildItem 'C:\ud-a' -Recurse -File -EA SilentlyContinue).Count)"
          Write-Host "%APPDATA%\Claude A files : $((Get-ChildItem "$env:APPDATA\Claude A" -Recurse -File -EA SilentlyContinue).Count)"
          Get-Process 'Claude A' -EA SilentlyContinue | Stop-Process -Force
          Write-Host '--- Application event log since launch ---'
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$t0} -EA SilentlyContinue |
            Select-Object -First 8 TimeCreated, ProviderName, LevelDisplayName, @{n='Msg';e={$_.Message -replace "`n",' ' }} |
            Format-List | Out-String -Width 200
          Start-Sleep -Seconds 10

      - name: Does Clone B (not injected) launch?
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Start-Process -FilePath "$env:RUNNER_TEMP\P\Claude B\Claude B.exe" -ArgumentList '--user-data-dir="C:\ud-b"' | Out-Null
          Start-Sleep -Seconds 50
          $p = @(Get-CimInstance Win32_Process -Filter "Name = 'Claude B.exe'")
          Write-Host "Clone B processes: $($p.Count)"
          Write-Host "C:\ud-b files: $((Get-ChildItem 'C:\ud-b' -Recurse -File -EA SilentlyContinue).Count)"
          Get-Process 'Claude B' -EA SilentlyContinue | Stop-Process -Force

      - name: VERDICT
        if: always()
        shell: pwsh
        run: |
          $a = (Get-ChildItem 'C:\ud-a' -Recurse -File -EA SilentlyContinue).Count +
               (Get-ChildItem "$env:APPDATA\Claude A" -Recurse -File -EA SilentlyContinue).Count
          $b = (Get-ChildItem 'C:\ud-b' -Recurse -File -EA SilentlyContinue).Count
          Write-Host "injected clone  wrote $a files to its own data dir"
          Write-Host "plain    clone  wrote $b files to its own data dir"
          if ($a -gt 0) { Write-Host '::notice::injected clone RUNS and isolates' }
          elseif ($b -gt 0) { Write-Host '::error::the COPY runs but the INJECTED clone does not — injection breaks the app' }
          else { Write-Host '::error::neither clone runs — the copy/rename itself is the problem' }
